aid: picogrid
name: Picogrid
description: >-
  Picogrid is an El Segundo, California defense and public-safety technology
  company whose Legion platform is an API-first systems-integration layer that
  unifies fragmented sensors, unmanned systems, and mission assets across land,
  sea, air, and space into a single decision-ready picture. The Legion Platform
  API (v3, OpenAPI 3.1, OAuth 2.0 via Keycloak) lets operators and AI agents not
  only observe but command physical systems: registering entities, streaming and
  searching feed data, dispatching tasking commands over MQTT, managing tracks,
  video streams and WebRTC, fine-grained authorization, event subscriptions and
  notifications, and cross-Legion federation. Applications include base security,
  satellite operations, air defense, SIGINT interoperability, wildfire detection,
  and human-machine teaming. Backed by Bessemer Venture Partners and Initialized
  Capital.
