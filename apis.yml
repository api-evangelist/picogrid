apis:
- name: Legion Platform API
  description: >-
    The Legion Platform HTTP API (v3, OpenAPI 3.1.0) for controlling and
    integrating data from unmanned and mission systems: entities and entity
    locations, feeds (message and file data) and feed definitions, tracks and
    track locations, tasking (dispatch commands over MQTT) and command
    registration, events and event subscriptions with delivery channels,
    notifications, video streams and DVR recordings, WebRTC connections,
    fine-grained authorization and permission templates, organizations and
    users, integrations (OAuth clients), and cross-Legion federation. Secured
    with OAuth 2.0 through a Keycloak "legion" realm.
  humanURL: https://docs.picogrid.com/reference
  baseURL: https://legion-prod.picogrid.com
  version: '3.0.0'
