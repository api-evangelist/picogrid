problems:
- status: 400
  category: BAD_REQUEST
  title: Bad request
  remediation: Validate the request body/parameters against the operation schema.
- status: 401
  category: UNAUTHORIZED
  title: Unauthorized
  remediation: Provide a valid OAuth 2.0 bearer access token from the Keycloak "legion" realm.
- status: 403
  category: FORBIDDEN
  title: Forbidden
  remediation: >-
    The token is valid but lacks the required organization permission
    (e.g. org:viewer/operator/admin) or scope for this resource.
- status: 404
  category: RESOURCE_NOT_FOUND
  title: Resource not found
  remediation: Verify the resource id and that it belongs to the active organization context.
  observed: true
- status: 409
  category: CONFLICT
  title: Conflict
  remediation: Resolve the conflicting state before retrying.
- status: 422
  category: UNPROCESSABLE_ENTITY
  title: Unprocessable entity
  remediation: The payload was well-formed but failed validation (e.g. command schema mismatch on tasking).
- status: 429
  category: RATE_LIMITED
  title: Too many requests
  remediation: Back off and retry; respect any rate-limit signaling.
- status: 500
  category: INTERNAL_SERVER_ERROR
  title: Internal server error
  remediation: Retry; if it persists contact support with the trace_id.
notes: >-
  The envelope shape and the RESOURCE_NOT_FOUND category / 404 title were
  observed directly from the live commercial host. The remaining status classes
